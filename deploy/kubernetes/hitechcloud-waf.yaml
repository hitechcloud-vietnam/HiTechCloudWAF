# Source: hitechcloud-waf/templates/admin-job.yaml
# Creates the first console administrator through the management API when
# no account with that name exists yet. Existing accounts are never changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: hitechcloud-waf-admin
  labels:
    helm.sh/chart: hitechcloud-waf-0.1.0
    app.kubernetes.io/name: hitechcloud-waf
    app.kubernetes.io/instance: hitechcloud-waf
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hitechcloud-waf
    app.kubernetes.io/component: admin-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hitechcloud-waf
        app.kubernetes.io/instance: hitechcloud-waf
        app.kubernetes.io/component: admin-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hitechcloud-waf
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: ghcr.io/hitechcloud-vietnam/hitechcloud-waf:latest
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              # The in-cluster call uses the API token; the console certificate
              # may be self-signed, and busybox wget cannot pin a CA.
              url="https://hitechcloud-waf-console:9443"
              token=$(cat /run/secrets/hcw/api-token)
              esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
              i=0
              until wget -q -T 5 --no-check-certificate -O /dev/null "$url/api/open/health"; do
                i=$((i+1)); [ "$i" -lt 120 ] || { echo "console not reachable at $url"; exit 1; }
                sleep 5
              done
              users=$(wget -q -T 10 --no-check-certificate --header "X-HCW-API-TOKEN: $token" -O - "$url/api/open/users")
              if printf '%s' "$users" | grep -q "\"username\":\"$(esc "$ADMIN_USERNAME")\""; then
                echo "account $ADMIN_USERNAME already exists, nothing to do"
                exit 0
              fi
              body="{\"username\":\"$(esc "$ADMIN_USERNAME")\",\"password\":\"$(esc "$(cat /run/secrets/hcw/admin-password)")\",\"role\":\"admin\"}"
              wget -q -T 30 --no-check-certificate --header "X-HCW-API-TOKEN: $token" \
                --header "Content-Type: application/json" --post-data "$body" -O - "$url/api/open/users" >/dev/null
              echo "account $ADMIN_USERNAME created"
          env:
            - name: ADMIN_USERNAME
              value: "admin"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/hcw
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: hitechcloud-waf-auth
            defaultMode: 0444
            items:
              - {key: api-token, path: api-token}
              - {key: admin-password, path: admin-password}
