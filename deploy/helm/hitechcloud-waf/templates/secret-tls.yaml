{{- /*
Cluster CA and the certificates it signs (controller, console). Generated
once and reused on upgrade (lookup); `helm template` always generates new
ones because it cannot read the cluster.
*/ -}}
{{- if include "hcw.needCA" . }}
{{- $fullname := include "hcw.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $ca := dict }}
{{- if .Values.cluster.ca.existingSecret }}
{{- $s := lookup "v1" "Secret" $ns .Values.cluster.ca.existingSecret }}
{{- if $s }}
{{- $ca = buildCustomCert (index $s.data "tls.crt") (index $s.data "tls.key") }}
{{- else }}
{{- /* helm template / dry run: the existing CA cannot be read; sign with a throw-away CA */ -}}
{{- $ca = genCA "HiTechCloud WAF Cluster CA" 3650 }}
{{- end }}
{{- else }}
{{- $s := lookup "v1" "Secret" $ns (printf "%s-ca" $fullname) }}
{{- if $s }}
{{- $ca = buildCustomCert (index $s.data "tls.crt") (index $s.data "tls.key") }}
{{- else }}
{{- $ca = genCA "HiTechCloud WAF Cluster CA" 3650 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-ca
  labels:
    {{- include "hcw.componentLabels" (list . "cluster") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
{{- end }}
{{- /* Console (management API) certificate */ -}}
{{- if not .Values.waf.api.tls.existingSecret }}
{{- $name := printf "%s-api-tls" $fullname }}
{{- $s := lookup "v1" "Secret" $ns $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hcw.componentLabels" (list . "waf") | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $s }}
  tls.crt: {{ index $s.data "tls.crt" }}
  tls.key: {{ index $s.data "tls.key" }}
{{- else }}
{{- $dns := list "localhost" }}
{{- range $svc := list "console" "primary" }}
{{- $base := printf "%s-%s" $fullname $svc }}
{{- $dns = concat $dns (list $base (printf "%s.%s" $base $ns) (printf "%s.%s.svc" $base $ns) (printf "%s.%s.svc.cluster.local" $base $ns)) }}
{{- end }}
{{- range .Values.console.ingress.hosts }}
{{- $dns = append $dns .host }}
{{- end }}
{{- $crt := genSignedCert (printf "%s-console" $fullname) (list "127.0.0.1") $dns 825 $ca }}
  tls.crt: {{ $crt.Cert | b64enc }}
  tls.key: {{ $crt.Key | b64enc }}
{{- end }}
{{- end }}
{{- /* Controller certificate */ -}}
{{- if and .Values.controller.enabled (not .Values.controller.tls.existingSecret) }}
{{- $name := printf "%s-controller-tls" $fullname }}
{{- $s := lookup "v1" "Secret" $ns $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hcw.componentLabels" (list . "controller") | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $s }}
  tls.crt: {{ index $s.data "tls.crt" }}
  tls.key: {{ index $s.data "tls.key" }}
{{- else }}
{{- $base := printf "%s-controller" $fullname }}
{{- $dns := concat (list $base (printf "%s.%s" $base $ns) (printf "%s.%s.svc" $base $ns) (printf "%s.%s.svc.cluster.local" $base $ns)) .Values.controller.tls.extraDNSNames }}
{{- $ips := concat (list "127.0.0.1") .Values.controller.tls.extraIPs }}
{{- $crt := genSignedCert $base $ips $dns 825 $ca }}
  tls.crt: {{ $crt.Cert | b64enc }}
  tls.key: {{ $crt.Key | b64enc }}
{{- end }}
{{- end }}
{{- end }}
