{{- if and .Values.controller.enabled (not .Values.cluster.existingSecret) }}
{{- $name := include "hcw.clusterSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hcw.componentLabels" (list . "cluster") | nindent 4 }}
type: Opaque
data:
  admin-token: {{ include "hcw.secretValue" (list . $name "admin-token" .Values.cluster.adminToken 64) }}
  node-token: {{ include "hcw.secretValue" (list . $name "node-token" .Values.cluster.nodeToken 64) }}
  dns-token: {{ include "hcw.secretValue" (list . $name "dns-token" .Values.cluster.dnsToken 64) }}
{{- end }}
