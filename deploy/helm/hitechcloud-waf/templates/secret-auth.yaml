{{- include "hcw.validate" . -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "hcw.authSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hcw.componentLabels" (list . "waf") | nindent 4 }}
type: Opaque
data:
  api-token: {{ include "hcw.secretValue" (list . $name "api-token" .Values.auth.apiToken 48) }}
  challenge-key: {{ include "hcw.secretValue" (list . $name "challenge-key" .Values.auth.challengeKey 64) }}
  admin-password: {{ include "hcw.secretValue" (list . $name "admin-password" .Values.auth.admin.password 20) }}
{{- end }}
