# HiTechCloud WAF Helm chart.
#
# Default: one WAF engine pod (Deployment, 1 replica) with a persistent data
# directory, a LoadBalancer Service for site traffic (80/443) and a ClusterIP
# Service for the web console / management API (9443).
#
# Scale-out (HPA, replicas > 1 or DaemonSet) needs configuration replication:
# enable primary + controller + agent (see ci/full-values.yaml).

nameOverride: ""
fullnameOverride: ""

# Extra labels on every object.
commonLabels: {}

# WAF engine image (hcw-waf). CI publishes `latest` and the commit SHA;
# pin a SHA in production.
image:
  repository: ghcr.io/hitechcloud-vietnam/hitechcloud-waf
  tag: latest
  pullPolicy: Always

# Cluster image (hcw: controller / agent / dns).
clusterImage:
  repository: ghcr.io/hitechcloud-vietnam/hitechcloud-waf-cluster
  tag: latest
  pullPolicy: Always

# Needed when the GHCR packages are private, e.g. [{name: ghcr-pull}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The binaries never call the Kubernetes API.
  automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Credentials of the WAF engine
# ---------------------------------------------------------------------------
auth:
  # Use an existing Secret instead of the one generated by the chart. Keys:
  #   api-token       (required, >= 16 chars) management API token
  #   challenge-key   (required, >= 32 chars) signs anti-bot/auth passes
  #   admin-password  (required when auth.admin.create, 10..72 chars)
  existingSecret: ""
  # Empty = random value, kept across `helm upgrade`.
  apiToken: ""
  challengeKey: ""
  admin:
    # Create the first console administrator through the API (post-install
    # Job). Skipped automatically when the console is served by several pods
    # without a primary (accounts are stored per engine).
    create: true
    username: admin
    # Empty = random value, kept across `helm upgrade`.
    password: ""
    # Job settings.
    backoffLimit: 6
    ttlSecondsAfterFinished: 600

# ---------------------------------------------------------------------------
# WAF engine pods (data plane; also the console when primary is disabled)
# ---------------------------------------------------------------------------
waf:
  # Deployment or DaemonSet.
  kind: Deployment
  # Ignored for DaemonSet and when autoscaling.enabled.
  replicaCount: 1
  # Deployment: strategy; DaemonSet: updateStrategy. Empty = chart default
  # (Recreate with a ReadWriteOnce volume, otherwise rolling).
  updateStrategy: {}

  # Run in the node network namespace (edge nodes, typically with a
  # DaemonSet): site ports open directly on the node and client addresses
  # are kept. The console port is then also open on the node: set
  # waf.api.allow.
  hostNetwork: false
  # Default: ClusterFirstWithHostNet with hostNetwork, ClusterFirst otherwise.
  dnsPolicy: ""

  # Sites listen on the ports configured in the console (usually 80/443).
  # When a containerPort below 1024 is used the chart sets the namespaced,
  # Pod-Security-"restricted"-compatible sysctl
  # net.ipv4.ip_unprivileged_port_start so the non-root engine can bind it.
  # With hostNetwork that sysctl is not allowed; the image's file capability
  # (cap_net_bind_service) is used instead, which requires
  # allowPrivilegeEscalation: true (set automatically).
  unprivilegedPortSysctl: true

  # Ports served for sites. containerPort must match the port of the site in
  # the console; port is the Service port (nodePort optional).
  ports:
    - name: http
      containerPort: 80
      port: 80
      protocol: TCP
      nodePort: null
    - name: https
      containerPort: 443
      port: 443
      protocol: TCP
      nodePort: null

  api:
    # Management API + web console (HTTPS) inside the pod.
    port: 9443
    # Restrict who may reach the API/console (IPs/CIDRs). Empty = anyone who
    # can reach the console Service. When set, probes switch to TCP (kubelet
    # addresses would otherwise be refused) and 127.0.0.1/32 is added for the
    # agent sidecar.
    allow: []
    tls:
      # Sign the console certificate with the chart CA (always on when the
      # in-chart controller is enabled). Otherwise the engine generates a
      # self-signed certificate in its data directory.
      generate: false
      # Existing kubernetes.io/tls Secret (tls.crt, tls.key) for the console.
      existingSecret: ""

  # waf.yaml, rendered into a ConfigMap. data_dir, api.* and
  # challenge_secret_file are managed by the chart. Every key here must be a
  # valid hcw-waf option (unknown keys stop the engine).
  config:
    bind: ""
    body_limit_kb: 1024
    # Set to the pod/ingress network when an L7 proxy sits in front, so the
    # client address is taken from X-Forwarded-For.
    trusted_proxies: []
    events_kept: 5000
    events_file: /var/lib/hcw-waf/events.jsonl
    access_log:
      file: /var/lib/hcw-waf/access.log
      max_size_mb: 100
      max_files: 5
    brand:
      name: HiTechCloud WAF
      color: "#1D4ED8"
      support_url: https://hitechcloud.vn
    acme:
      enabled: false
      email: admin@example.vn
    # node_name: hn-01
    # geoip_db: /etc/hcw-waf/extra/country.mmdb      # mount with extraVolumes
    # extra_rules_file: /etc/hcw-waf/extra/custom.conf
    # alerts:
    #   kinds: [waf, geo, rate_limit, bot, auth]
    #   interval: 5m
    #   telegram:
    #     bot_token_file: /etc/hcw-waf/extra/telegram.token
    #     chat_id: "-1001234567890"

  # Data directory (/var/lib/hcw-waf): sites, certificates, users, ACME
  # cache, events, access log.
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 2Gi
    annotations: {}
    # Keep the PVC on `helm uninstall`.
    keep: true
    # DaemonSet only: use this host directory instead of a PVC.
    hostPath: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
    fsGroup: 10002
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # NET_BIND_SERVICE is always kept in the capability bounding set: the
  # image binary carries the file capability cap_net_bind_service, and the
  # kernel refuses to execute it when that capability is not in the bounding
  # set (dropping ALL alone makes the container fail with "operation not
  # permitted"). A non-root process only gains it on exec, never otherwise.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]

  probes:
    # auto: HTTPS GET /api/open/health, or TCP when waf.api.allow is set.
    # Other values: http, tcp.
    mode: auto
    startup:
      enabled: true
      periodSeconds: 5
      failureThreshold: 60
      timeoutSeconds: 3
    liveness:
      enabled: true
      periodSeconds: 10
      failureThreshold: 6
      timeoutSeconds: 3
    readiness:
      enabled: true
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 3

  terminationGracePeriodSeconds: 30
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraArgs: []        # e.g. [-debug]
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# Service for site traffic.
service:
  type: LoadBalancer          # LoadBalancer, NodePort or ClusterIP
  # Local keeps the client address (needed for IP rules and rate limits).
  externalTrafficPolicy: Local
  annotations: {}
  labels: {}
  loadBalancerIP: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  ipFamilyPolicy: ""
  ipFamilies: []

# Web console / management API.
console:
  service:
    type: ClusterIP
    port: 9443
    nodePort: null
    annotations: {}
    labels: {}
    loadBalancerSourceRanges: []
  ingress:
    enabled: false
    className: ""
    # The console only speaks HTTPS: tell the ingress controller.
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    hosts:
      - host: waf-console.example.vn
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: waf-console-tls
    #    hosts: [waf-console.example.vn]

podDisruptionBudget:
  enabled: true
  # One of the two (minAvailable wins when set).
  minAvailable: null
  maxUnavailable: 1

# Deployment only. Needs agent replication (see the header).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

metrics:
  # Prometheus Operator ServiceMonitor for GET /api/open/metrics (HTTPS,
  # Bearer API token read from the auth Secret).
  serviceMonitor:
    enabled: false
    # Labels your Prometheus selects ServiceMonitors by (e.g. release: kube-prometheus-stack).
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    # Used when the console certificate is not signed by the chart CA.
    insecureSkipVerify: true
    relabelings: []
    metricRelabelings: []

# ---------------------------------------------------------------------------
# Primary engine: a single, persistent engine where administrators edit sites
# and certificates. The controller replicates its configuration to every
# WAF pod through the agent sidecars. Required for in-chart scale-out.
# ---------------------------------------------------------------------------
primary:
  enabled: false
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 2Gi
    annotations: {}
    keep: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

# ---------------------------------------------------------------------------
# Cluster: controller, agent sidecar, DNS
# ---------------------------------------------------------------------------
cluster:
  # Existing Secret with admin-token, node-token, dns-token. Empty = the
  # chart generates them (kept across upgrades).
  existingSecret: ""
  adminToken: ""
  nodeToken: ""
  dnsToken: ""
  ca:
    # Existing Secret holding the cluster CA (tls.crt, tls.key). It signs the
    # controller and console certificates. Empty = generated by the chart.
    existingSecret: ""

controller:
  enabled: false
  port: 7443
  service:
    # LoadBalancer/NodePort when agents or DNS servers outside this
    # Kubernetes cluster must reach the controller.
    type: ClusterIP
    port: 7443
    nodePort: null
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  tls:
    # Existing kubernetes.io/tls Secret for the controller (tls.crt, tls.key);
    # its issuer must be the cluster CA. Empty = signed by the chart CA.
    existingSecret: ""
    # Extra names/addresses in the generated certificate (public DNS name or
    # load balancer IP used by agents outside the cluster).
    extraDNSNames: []
    extraIPs: []
  # controller.yaml options (state_file, listen, tokens and primary are
  # managed by the chart).
  config:
    heartbeat_timeout: 30s
    probe_interval: 10s
    probe_timeout: 3s
    probe_insecure: true
    forget_after: 0s
    sync_interval: 15s
    brand:
      name: HiTechCloud WAF
      primary_color: "#1D4ED8"
      logo_url: ""
      support_url: https://hitechcloud.vn
  primary:
    # Engine whose configuration is replicated. Empty = the in-chart primary
    # (primary.enabled) or, without it, the WAF console Service. Its
    # certificate must be signed by the cluster CA and it must accept the
    # auth API token.
    baseURL: ""
    resources:
      - name: cert
        path: /api/open/cert
        key_fields: [domains]
        ignore_fields: [created_at, updated_at, issuer, not_after]
        prune: true
      - name: site
        path: /api/open/site
        key_fields: [server_names]
        ignore_fields: [created_at, updated_at]
        refs: {cert_id: cert}
        prune: true
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 1Gi
    annotations: {}
    keep: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

# Agent sidecar in every WAF pod: heartbeats, statistics and events to the
# controller, and replication of the primary configuration into the pod.
agent:
  enabled: false
  # Empty = the in-chart controller.
  controllerURL: ""
  # For an external controller: Secret with its CA (key ca.crt) and Secret
  # with the node token (key node-token). Empty = in-chart CA / cluster
  # Secret.
  controllerCASecret: ""
  nodeTokenSecret: ""
  # Placeholders replaced at pod start: __POD_NAME__, __POD_IP__,
  # __HOST_IP__, __NODE_NAME__.
  id: ""                 # default: pod hostname
  name: ""
  region: ""
  pools: [web]
  # Public address DNS answers point to. Empty = auto-detected (the pod or,
  # with hostNetwork, the node address). Behind a LoadBalancer set the LB IP.
  ipv4: ""
  ipv6: ""
  weight: 100
  labels: {}
  # Optional probe from the controller; its host must equal ipv4/ipv6,
  # e.g. http://__HOST_IP__:80/ with hostNetwork.
  probeURL: ""
  interval: 10s
  applyConfig: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop: [ALL]

# Authoritative DNS answering with healthy nodes only.
dns:
  enabled: false
  replicaCount: 2
  # The server listens on this unprivileged port; the Service publishes 53.
  containerPort: 5353
  # Empty = the in-chart controller.
  controllerURL: ""
  controllerCASecret: ""
  # Secret with key dns-token for an external controller.
  tokenSecret: ""
  refresh: 5s
  zones: []
  # - name: waf.example.vn
  #   ns: [ns1.waf.example.vn, ns2.waf.example.vn]
  #   hostmaster: noc.example.vn
  #   ttl: 30
  #   records:
  #     - {name: ns1, type: A, value: 203.0.113.53}
  #     - {name: ns2, type: A, value: 198.51.100.53}
  #     - {name: edge, pool: web, max_answers: 2, fail_open: true}
  service:
    type: LoadBalancer
    port: 53
    externalTrafficPolicy: Local
    annotations: {}
    loadBalancerIP: ""
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
