# HiTechCloud WAF – agent for every WAF node. Run next to the node's WAF
# engine stack (../../compose.yaml).
services:
  hcw-agent:
    image: ${HCW_CLUSTER_IMAGE:-ghcr.io/hitechcloud-vietnam/hitechcloud-waf-cluster:latest}
    build: ..
    container_name: hcw-agent
    command: ["agent", "-config", "/etc/hcw/agent.yaml"]
    restart: always
    network_mode: host          # reaches the local console on 127.0.0.1:9443
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${HCW_ETC:-/etc/hcw}:/etc/hcw:ro
      - ${HCW_STATE:-/var/lib/hcw}:/var/lib/hcw
