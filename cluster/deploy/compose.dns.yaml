# HiTechCloud WAF – authoritative DNS. Run at least two, in different
# locations, and register them as the NS of the zone.
services:
  hcw-dns:
    image: ${HCW_CLUSTER_IMAGE:-ghcr.io/hitechcloud-vietnam/hitechcloud-waf-cluster:latest}
    build: ..
    container_name: hcw-dns
    command: ["dns", "-config", "/etc/hcw/dns.yaml"]
    restart: always
    user: "0:0"                 # binds port 53; every other capability dropped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ${HCW_ETC:-/etc/hcw}:/etc/hcw:ro
