name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [waf, cluster, ctl, bench, mcp_server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: |
            waf/go.sum
            cluster/go.sum
      - name: vet
        working-directory: e2e
        run: go vet ./...
      - name: gofmt
        working-directory: e2e
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: end-to-end
        working-directory: e2e
        env:
          HCW_E2E: "1"
        run: go test -count=1 -v -timeout 8m ./...

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [waf, cluster, ctl, bench, mcp_server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: waf
            image: hitechcloud-waf
          - context: cluster
            image: hitechcloud-waf-cluster
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/hitechcloud-vietnam/${{ matrix.image }}:latest
            ghcr.io/hitechcloud-vietnam/${{ matrix.image }}:${{ github.sha }}

  helm:
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/hitechcloud-waf
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: helm lint
        run: |
          helm lint "$CHART" --strict
          for f in "$CHART"/ci/*.yaml; do
            helm lint "$CHART" --strict -f "$f"
          done
      - name: helm template
        run: |
          mkdir -p rendered
          helm template ci "$CHART" --namespace waf > rendered/default.yaml
          for f in "$CHART"/ci/*.yaml; do
            helm template ci "$CHART" --namespace waf -f "$f" > "rendered/$(basename "$f")"
          done
      - name: kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml deploy/kubernetes/namespace.yaml deploy/kubernetes/hitechcloud-waf.yaml
      - name: plain manifests up to date
        run: deploy/kubernetes/render.sh --check
