name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (creates the tag on the selected branch)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build binaries
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $VERSION"; exit 1; }
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd waf && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../dist/hcw-waf-linux-$arch ./cmd/hcw-waf)
            (cd cluster && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../dist/hcw-linux-$arch ./cmd/hcw)
          done
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            (cd ctl && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/hitechcloud-vietnam/HiTechCloudWAF/ctl/internal/cli.Version=${VERSION}" -o ../dist/hcwctl-$os-$arch$ext ./cmd/hcwctl)
          done
          cp scripts/install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          # The section "## vX.Y.Z – date" up to the next "## v" heading.
          awk -v v="$VERSION" '
            /^## v/ { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          {
            echo
            echo "---"
            echo "Install: \`curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.sh && sudo bash install.sh node\`"
            echo
            echo "Deployment guide: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/deploy.vi.md"
          } >> release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: HiTechCloud WAF ${{ inputs.version || github.ref_name }}
          files: dist/*
          body_path: release-notes.md
