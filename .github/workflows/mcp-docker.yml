name: MCP image

on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mcp_server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hitechcloud-waf-mcp:latest
            ghcr.io/${{ github.repository_owner }}/hitechcloud-waf-mcp:${{ github.sha }}
