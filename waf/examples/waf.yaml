# HiTechCloud WAF engine (one per node)
data_dir: /var/lib/hcw-waf        # sites/certs (config.json) and API certificate
bind: ""                          # address for site ports; "" = all interfaces

api:
  listen: 127.0.0.1:9443          # management API (HTTPS)
  token_file: /etc/hcw-waf/api.token   # generate: hcw token > /etc/hcw-waf/api.token
  # tls_cert / tls_key: leave empty to auto-generate a self-signed certificate

body_limit_kb: 1024               # request body bytes inspected
trusted_proxies: []               # load balancers in front, e.g. [10.0.0.0/8]
events_kept: 5000                 # in-memory attack events (API /api/open/events)
events_file: /var/lib/hcw-waf/events.jsonl
# Shared by all nodes behind one DNS name (generate: hcw token > file):
# challenge_secret_file: /etc/hcw-waf/challenge.key
# extra_rules_file: /etc/hcw-waf/custom.conf   # your own SecLang rules

brand:
  name: HiTechCloud WAF
  color: "#1D4ED8"
  support_url: https://hitechcloud.vn
