# HiTechCloud WAF engine (one per node)
data_dir: /var/lib/hcw-waf        # sites/certs (config.json) and API certificate
bind: ""                          # address for site ports; "" = all interfaces

api:
  listen: 127.0.0.1:9443          # management API (HTTPS)
  token_file: /etc/hcw-waf/api.token   # generate: hcw token > /etc/hcw-waf/api.token
  # Web console: https://<listen>/ . To reach it remotely set listen to
  # 0.0.0.0:9443 and restrict who may connect:
  # allow: [203.0.113.0/24, 10.0.0.0/8]
  # tls_cert / tls_key: leave empty to auto-generate a self-signed certificate

body_limit_kb: 1024               # request body bytes inspected
# body_args_limit_kb: 128         # largest JSON/form/XML body accepted by block-mode sites (413 above)
# waf_concurrency: 0              # CRS inspections at once (0 = 2 × CPU cores); others wait, 503 after 10 s
cache_mb: 256                     # memory for the response cache of all sites (-1 = off)
trusted_proxies: []               # load balancers in front, e.g. [10.0.0.0/8]
access_log:                       # one JSON line per request; remove to disable
  file: /var/lib/hcw-waf/access.log
  max_size_mb: 100                # rotate to access.log.1 … .N
  max_files: 5
events_kept: 5000                 # in-memory attack events (API /api/open/events)
events_file: /var/lib/hcw-waf/events.jsonl
# Shared by all nodes behind one DNS name (generate: hcw token > file):
# challenge_secret_file: /etc/hcw-waf/challenge.key
# Country database for country_allow/deny (DB-IP Lite or GeoLite2):
# geoip_db: /etc/hcw-waf/country.mmdb
# extra_rules_file: /etc/hcw-waf/custom.conf   # your own SecLang rules

brand:
  name: HiTechCloud WAF
  color: "#1D4ED8"
  support_url: https://hitechcloud.vn

# Let's Encrypt for sites with "auto_tls": true (needs port 80 reachable
# for the domain, or TLS-ALPN on the https port).
acme:
  enabled: false
  email: admin@example.vn
  # directory_url: https://acme-staging-v02.api.letsencrypt.org/directory

# Security alerts (Telegram and/or signed webhooks). Events are grouped per
# site and kind; at most one message per interval.
# node_name: hn-01
# alerts:
#   kinds: [waf, geo, rate_limit, bot, auth, threat_intel]
#   interval: 5m
#   include_monitor: false
#   telegram:
#     bot_token_file: /etc/hcw-waf/telegram.token   # from @BotFather
#     chat_id: "-1001234567890"                      # group/channel id
#   webhooks:
#     - url: https://hooks.example.vn/waf
#       secret: change-me                            # X-HCW-Signature: sha256=HMAC(body)

# Threat intelligence: IP/CIDR lists downloaded in the background (plain
# text, "#"/";" comments: FireHOL .netset/.ipset, Spamhaus DROP, ...). A copy
# is kept in <data_dir>/threatintel so lists work at start-up while offline;
# on a failed download the previous list stays in use. Sites opt in with
# "threat_intel": "block" | "challenge" | "monitor" (default "off").
# Private, loopback, link-local and CGNAT addresses are never matched.
# threat_intel:
#   timeout: 60s              # per download
#   max_size_mb: 32           # larger lists are refused
#   feeds:
#     - name: firehol_level1
#       url: https://iplists.firehol.org/files/firehol_level1.netset
#       refresh: 1h
#     - name: spamhaus_drop
#       url: https://www.spamhaus.org/drop/drop.txt
#       refresh: 12h
#     - name: local
#       url: file:///etc/hcw-waf/blocklist.txt
#       refresh: 5m

# Sites (applications) are managed through the console or the management
# API, not in this file. See examples/site.json for a site using weighted
# upstreams ("http://10.0.0.10:8080 weight=3"), "lb" (round_robin, weighted,
# least_conn, ip_hash, random), sticky sessions and header rewriting
# (request_headers, response_headers, hide_server_headers).
